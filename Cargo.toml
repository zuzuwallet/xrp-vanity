[package]
name = "xrpl-vanity"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Offline XRPL Ed25519 vanity classic-address generator"
readme = "README.md"

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
# argon2 0.5.3 wipes its Blake2 state when `zeroize` is on, but it does not
# enable generic-array's `zeroize` feature. This is the copy already in the
# lock. The feature turns on `GenericArray::zeroize` so that wipe compiles.
generic-array = { version = "=0.14.7", features = ["zeroize"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "zeroize", "fast"] }
getrandom = "0.2"
num-bigint = "0.4"
ring = "0.17"
ripemd = "0.1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
xrpl-rust = { version = "1.3.0", default-features = false, features = ["wallet"] }
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "xrpl_vanity"
path = "src/lib.rs"

[[bin]]
name = "xrpl-vanity"
path = "src/main.rs"

[[bench]]
name = "derive"
harness = false
